name: Ubuntu clean suite

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ubuntu-clean-suite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-suite:
    name: Full repository suite
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      RUN_GENLAYER_INTEGRATION: "0"
      RUN_GENLAYER_V3_INTEGRATION: "0"

    steps:
      - name: Check out the complete repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"

      - name: Verify dependency, action, runtime, and GenVM pins
        run: python scripts/check_reproducibility.py

      - name: Install pinned contract tooling
        run: |
          python -m pip install --disable-pip-version-check "pip==26.2.1"
          python -m pip install --disable-pip-version-check --requirement requirements-dev.txt
          python -m pip check

      - name: Lint submitted GenVM contracts and run every direct test
        run: python scripts/check_contracts.py --legacy

      - name: Prove formation, check-in and settlement boundaries from chain timestamps
        run: >-
          python -m pytest
          -p gltest.direct.pytest_plugin
          -p no:cacheprovider
          -vv -s --tb=short
          tests/test_chain_timestamps_v3.py

      - name: Run v2/v3 consensus acceptance tests against isolated GLSim
        env:
          RUN_GENLAYER_INTEGRATION: "1"
          RUN_GENLAYER_V3_INTEGRATION: "1"
        run: |
          glsim \
            --host 127.0.0.1 \
            --port 4000 \
            --validators 5 \
            --max-rotations 5 \
            --no-browser \
            --seed 20260905 \
            > /tmp/commitment-pools-glsim.log 2>&1 &
          simulator_pid=$!
          trap 'kill "$simulator_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              --header "content-type: application/json" \
              --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' \
              http://127.0.0.1:4000/api > /tmp/commitment-pools-glsim-ready.json; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat /tmp/commitment-pools-glsim.log
            exit 1
          fi
          if ! env -u PYTEST_DISABLE_PLUGIN_AUTOLOAD gltest \
              tests/test_integration_v2.py \
              tests/test_integration_v3.py \
              --network localnet \
              -v -s; then
            cat /tmp/commitment-pools-glsim.log
            exit 1
          fi

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"

      - name: Activate pinned pnpm
        working-directory: frontend
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
          test "$(pnpm --version)" = "11.19.0"

      - name: Install the frozen frontend dependency graph
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Check frontend formatting
        working-directory: frontend
        run: pnpm format:check

      - name: Lint frontend with zero warnings
        working-directory: frontend
        run: pnpm lint

      - name: Type-check frontend
        working-directory: frontend
        run: pnpm typecheck

      - name: Run every frontend test
        working-directory: frontend
        run: pnpm test

      - name: Build the Sites target
        working-directory: frontend
        run: pnpm build

      - name: Build the Vercel target
        working-directory: frontend
        run: pnpm build:vercel

      - name: Type-check the generated Vercel target
        working-directory: frontend
        run: pnpm exec tsc --noEmit --project tsconfig.vercel.json

      - name: Match deployed contract source to this checkout
        working-directory: frontend
        run: |
          for attempt in 1 2 3; do
            if node scripts/verify-security-release.mjs --expected-fee-bps 500; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep "$((attempt * 5))"
          done

      - name: Confirm tests did not change tracked source
        run: git diff --exit-code
